name: Sitio web (GitHub Pages)

# Publica la carpeta sitio/ en GitHub Pages.
# Antes de que funcione hay que activar Pages una vez en GitHub:
# Settings → Pages → Build and deployment → Source: «GitHub Actions».
on:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar sitio/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que no falte ningún archivo enlazado
        run: python3 .github/revisar_sitio.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
